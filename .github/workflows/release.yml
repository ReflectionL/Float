name: Release

# Publishes v$MARKETING_VERSION when a version bump lands on main.
# Pushes that leave version.env unchanged, or whose tag already exists, do nothing.
on:
  push:
    branches: [main]
    paths: [version.env]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          source version.env
          tag="v$MARKETING_VERSION"
          echo "version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.version.outputs.skip == 'false'
        run: |
          bash scripts/test.sh
          bash scripts/test-native.sh
          bash scripts/test-updates.sh

      - name: Build universal app
        if: steps.version.outputs.skip == 'false'
        run: |
          FLOAT_RELEASE_TAG="${{ steps.version.outputs.tag }}" bash scripts/build-app.sh --universal
          lipo -info build/Float.app/Contents/MacOS/WorkThreadTimeline
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Float.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :FloatReleaseTag" build/Float.app/Contents/Info.plist
          codesign --verify --deep --strict build/Float.app

      - name: Package
        if: steps.version.outputs.skip == 'false'
        run: |
          bash scripts/package-dmg.sh
          bash scripts/release-notes.sh "${{ steps.version.outputs.version }}" > notes.md
          cat >> notes.md <<'NOTES'

          ---
          已安装 Float 的用户会在应用内收到更新提示（工具栏下载图标或 Float → Check for Updates…）。首次安装：打开 `Float-*.dmg`，把 Float 拖到「Applications」。Apple 芯片和 Intel 通用。应用只做了 ad-hoc 签名、未经 Apple 公证，首次打开请右键 → 打开；可用附带的 SHA-256 文件校验下载。
          NOTES

      - name: Publish release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "Float ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            "dist/Float-${{ steps.version.outputs.version }}.dmg" \
            "dist/Float-${{ steps.version.outputs.version }}.dmg.sha256"
