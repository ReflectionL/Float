name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect release pull request
        # Only a pull request that changes version.env publishes a release,
        # so only that one pays for the universal build and DMG check.
        id: release
        run: |
          if [[ -n "${{ github.base_ref }}" ]] && ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- version.env; then
            echo "is=true" >> "$GITHUB_OUTPUT"
          else
            echo "is=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Toolchain
        run: |
          sw_vers
          xcrun swiftc --version

      - name: Build app
        run: bash scripts/build-app.sh

      - name: Build QA app
        run: bash scripts/build-app.sh --qa

      - name: Core tests
        run: bash scripts/test.sh

      - name: Native interaction tests
        run: bash scripts/test-native.sh

      - name: Updater tests
        run: bash scripts/test-updates.sh

      - name: Release build smoke test
        if: steps.release.outputs.is == 'true'
        # Builds and packages what the release workflow ships, then checks the
        # DMG the way the in-app updater will: checksum, mount, signature, tags.
        run: |
          source version.env
          FLOAT_RELEASE_TAG="v$MARKETING_VERSION" bash scripts/build-app.sh --universal
          lipo -info build/Float.app/Contents/MacOS/WorkThreadTimeline | grep -q "x86_64 arm64\|arm64 x86_64"
          bash scripts/package-dmg.sh
          dmg="dist/Float-$MARKETING_VERSION.dmg"
          (cd dist && shasum -a 256 -c "Float-$MARKETING_VERSION.dmg.sha256")
          mount="$RUNNER_TEMP/mount"
          mkdir "$mount"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mount" "$dmg"
          app="$mount/Float.app"
          test -L "$mount/Applications"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :FloatReleaseTag' "$app/Contents/Info.plist")" = "$MARKETING_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "local.xline.WorkThreadTimeline"
          hdiutil detach "$mount"

      - name: Check version and changelog
        run: |
          source version.env
          head -1 README.md | grep -qx "# Float — $MARKETING_VERSION" \
            || { echo "::error::README title does not match version.env ($MARKETING_VERSION)"; exit 1; }
          notes="$(bash scripts/release-notes.sh "$MARKETING_VERSION")"
          if [[ -z "$notes" || "$notes" == "- " ]]; then
            echo "::error::CHANGELOG.md has no notes for $MARKETING_VERSION"; exit 1
          fi
